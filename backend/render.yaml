services:
  - type: web
    name: la-lista-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ADMIN_TOKEN
        sync: false
      - key: COMP_CODE
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: PRICE_ARS
        value: "1500"
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
