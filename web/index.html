<style>
  :root{
    color-scheme: dark light;
    --asphalt:#14171c;
    --graphite:#1b1f26;
    --graphite-2:#20252e;
    --line:#2b313b;
    --bone:#f2efe8;
    --muted:#8b93a1;
    --dust:#d8c9a8;
    --shadow: 0 1px 0 rgba(0,0,0,.4);
    --acc:#e63946;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --asphalt:#efece4;
      --graphite:#ffffff;
      --graphite-2:#f6f3ec;
      --line:#ddd7ca;
      --bone:#1a1d22;
      --muted:#6b7280;
      --dust:#8a6d3b;
      --shadow: 0 1px 0 rgba(0,0,0,.04);
    }
  }
  :root[data-theme="dark"]{
    --asphalt:#14171c;--graphite:#1b1f26;--graphite-2:#20252e;--line:#2b313b;
    --bone:#f2efe8;--muted:#8b93a1;--dust:#d8c9a8;--shadow:0 1px 0 rgba(0,0,0,.4);
  }
  *{box-sizing:inherit;margin:0;padding:0}
  html{height:100%;scroll-padding-top: var(--safe-t);}
  body{
    min-height:100%;
    background:var(--asphalt);
    color:var(--bone);
    font-family:"Barlow",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.4;
    -webkit-font-smoothing:antialiased;
    padding-bottom: calc(24px + var(--safe-b));
  }
  .cond{font-family:"Barlow Condensed",system-ui,sans-serif;}
  .app{max-width:560px;margin:0 auto;}

  /* Header */
  header{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--asphalt) 88%, transparent);
    backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--line);
    padding: calc(12px + var(--safe-t)) 16px 0;
  }
  .brand{display:flex;align-items:center;gap:10px;padding-bottom:12px}
  .flag{
    width:26px;height:26px;flex:none;border-radius:5px;
    background:
      conic-gradient(var(--bone) 90deg, transparent 0 180deg, var(--bone) 0 270deg, transparent 0) 0 0/13px 13px;
    background-color:#0c0e12;
    outline:1px solid var(--line);
  }
  .wordmark{font-family:"Barlow Condensed";font-weight:700;letter-spacing:.04em;font-size:24px;line-height:1}
  .wordmark small{display:block;font-family:"Barlow";font-weight:500;letter-spacing:.02em;
    font-size:11.5px;color:var(--muted);margin-top:2px;text-transform:none}
  .whereami{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);line-height:1.3}
  .whereami b{color:var(--dust);font-weight:600}
  .live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);
    background:var(--graphite);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .live b{color:var(--bone);font-family:"Barlow Condensed";font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .live-dot{width:9px;height:9px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 0 rgba(46,204,113,.6);
    animation:livepulse 1.8s infinite}
  @keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.55)}70%{box-shadow:0 0 0 8px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}

  /* Category switch */
  .cats{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{
    appearance:none;background:none;border:none;cursor:pointer;
    font-family:"Barlow Condensed";font-weight:600;font-size:16px;letter-spacing:.02em;
    color:var(--muted);padding:12px 12px 12px 2px;white-space:nowrap;
    border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .15s;
  }
  .cat:first-child{padding-left:0}
  .cat .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .cat[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--cat-acc)}

  /* View switch */
  .views{display:flex;gap:8px;padding:14px 16px 4px}
  .view-btn{
    flex:1;appearance:none;cursor:pointer;
    background:var(--graphite);border:1px solid var(--line);border-radius:9px;
    color:var(--muted);font-family:"Barlow Condensed";font-weight:600;font-size:16px;
    letter-spacing:.03em;padding:9px;transition:all .15s;
  }
  .view-btn[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}

  main{padding:8px 16px 0}

  /* Meta row */
  .meta{display:flex;align-items:center;gap:10px;margin:8px 2px 12px;color:var(--muted);font-size:13px}
  .meta .count{color:var(--bone);font-family:"Barlow Condensed";font-weight:600;font-size:20px}
  .search{
    margin-left:auto;flex:1;max-width:190px;
    background:var(--graphite);border:1px solid var(--line);border-radius:8px;
    color:var(--bone);font:inherit;font-size:14px;padding:7px 11px;
  }
  .search::placeholder{color:var(--muted)}
  .search:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}

  /* Pilotos list */
  .row{display:flex;align-items:center;gap:13px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .num{
    flex:none;min-width:44px;height:40px;padding:0 6px;
    display:flex;align-items:center;justify-content:center;
    background:var(--graphite-2);border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:7px;
    font-family:"Barlow Condensed";font-weight:700;font-size:23px;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .who{min-width:0;flex:1}
  .name{font-weight:600;font-size:15.5px;line-height:1.2}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub .marca{color:var(--dust)}

  /* Podium */
  .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:6px 0 18px}
  .pod{
    background:var(--graphite);border:1px solid var(--line);border-radius:11px;
    padding:12px 8px;text-align:center;position:relative;overflow:hidden;
  }
  .pod::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--pos-c)}
  .pod .pos{font-family:"Barlow Condensed";font-weight:700;font-size:15px;color:var(--pos-c);letter-spacing:.04em}
  .pod .pn{font-weight:600;font-size:13.5px;line-height:1.15;margin:5px 0 1px;min-height:2.3em;
    display:flex;align-items:center;justify-content:center}
  .pod .pnum{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .pod .pts{font-family:"Barlow Condensed";font-weight:700;font-size:29px;line-height:1;margin-top:7px;
    font-variant-numeric:tabular-nums}
  .pod .pts span{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
  .pod.p1{padding-top:18px}
  .pod.p1 .pts{font-size:34px}

  /* Standings table */
  .tbl-h{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 8px}
  .tbl-h h2{font-family:"Barlow Condensed";font-weight:600;font-size:16px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .tbl-h .fechas{font-size:12px;color:var(--muted)}
  .st{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .st .p{flex:none;width:22px;text-align:right;font-family:"Barlow Condensed";font-weight:700;font-size:19px;color:var(--muted);font-variant-numeric:tabular-nums}
  .st .cn{flex:none;width:38px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .st .sn{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st .sn em{font-style:normal;color:var(--dust);font-weight:500;font-size:12px;display:block;margin-top:1px}
  .st .sp{flex:none;font-family:"Barlow Condensed";font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
  .st.lead{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,transparent),transparent);
    margin:0 -4px;padding-left:8px;padding-right:8px;border-radius:8px}
  .st.lead .p{color:var(--acc)}

  /* Empty state */
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-family:"Barlow Condensed";font-weight:600;font-size:20px;color:var(--bone);margin-bottom:6px}

  /* Avisos / notificaciones */
  .aviso{display:flex;gap:10px;align-items:flex-start;margin:12px 16px 0;padding:11px 12px;
    background:var(--graphite);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:9px}
  .aviso .bell{flex:none;font-size:15px;line-height:1.3;filter:grayscale(.2)}
  .aviso .txt{flex:1;font-size:13.5px;line-height:1.35}
  .aviso .txt b{color:var(--dust);font-weight:600;font-family:"Barlow Condensed";letter-spacing:.02em;font-size:14px}
  .aviso .x{flex:none;appearance:none;background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:17px;line-height:1;padding:2px 2px 2px 6px}
  .aviso .x:hover{color:var(--bone)}

  /* Cronograma */
  .note{margin:10px 2px 4px;color:var(--muted);font-size:12.5px}
  .daytabs{display:flex;gap:8px;margin:12px 0 6px}
  .daytab{flex:1;appearance:none;cursor:pointer;background:var(--graphite);border:1px solid var(--line);
    border-radius:9px;color:var(--muted);font-family:"Barlow Condensed";font-weight:600;font-size:16px;
    letter-spacing:.03em;padding:9px}
  .daytab[aria-selected="true"]{background:var(--graphite-2);color:var(--bone);border-color:var(--acc)}
  .ses{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .ses .h{flex:none;min-width:52px;font-family:"Barlow Condensed";font-weight:700;font-size:19px;
    font-variant-numeric:tabular-nums;color:var(--bone)}
  .ses .act{flex:1;min-width:0;font-weight:600;font-size:15px}
  .chip{flex:none;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
    border:1px solid var(--chip-c);color:var(--chip-c)}
  .chip.all{--chip-c:var(--muted)}

  /* Pantalla de pago (Mercado Pago) */
  .gate{position:fixed;inset:0;z-index:100;background:rgba(9,11,14,.94);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    padding:24px;padding-top:calc(24px + var(--safe-t));padding-bottom:calc(24px + var(--safe-b))}
  .gate.hidden{display:none}
  .gate-card{max-width:360px;width:100%;background:var(--graphite);border:1px solid var(--line);
    border-radius:16px;padding:26px 22px;text-align:center}
  .gate-flag{width:44px;height:44px;margin:0 auto 14px;border-radius:8px;background-color:#0c0e12;
    background:conic-gradient(var(--bone) 90deg,transparent 0 180deg,var(--bone) 0 270deg,transparent 0) 0 0/22px 22px;outline:1px solid var(--line)}
  .gate-card h2{font-family:"Barlow Condensed";font-weight:700;font-size:30px;letter-spacing:.03em;margin-bottom:6px}
  .gate-card p{color:var(--muted);font-size:14px;line-height:1.45}
  .gate-price{font-family:"Barlow Condensed";font-weight:700;font-size:44px;line-height:1;margin:18px 0 2px;color:var(--bone)}
  .gate-price span{font-size:15px;color:var(--muted);font-weight:500}
  .gate-btn{width:100%;margin-top:14px;padding:14px;border-radius:10px;background:#009ee3;color:#fff;
    font-family:"Barlow",sans-serif;font-weight:700;font-size:16px;cursor:pointer;border:none}
  .gate-btn:disabled{opacity:.6;cursor:default}
  .gate-fine{margin-top:12px;font-size:12px;color:var(--muted)}
  .gate-skip{margin-top:16px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
  .gate-demo{margin-top:8px;font-size:11px;color:var(--acc);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .gate-form{margin-top:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
  .gate-form input{background:var(--graphite-2);border:1px solid var(--line);border-radius:9px;
    color:var(--bone);font:inherit;font-size:15px;padding:11px 12px;width:100%}
  .gate-form input:focus{outline:2px solid #009ee3;border-color:transparent}
  .gate-err{color:#ff6b6b;font-size:12.5px;margin-top:8px;min-height:1.1em;text-align:left}

  footer{margin:22px 16px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.5}
  footer b{color:var(--dust);font-weight:600}
  .hidden{display:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

/* ===========================================================================
   RENDER
   =========================================================================== */
const state = { cat: DATA.categories[0].id, view: "pilotos", q: "", dia: 0 };
const $ = s => document.querySelector(s);
const catById = id => DATA.categories.find(c => c.id === id);
const numval = n => { const x = parseInt(n, 10); return isNaN(x) ? 1e9 : x; };
const posColor = p => p===1 ? "#e9c454" : p===2 ? "#c7ccd4" : p===3 ? "#cd7f4a" : "var(--muted)";

function setAccent(c){ document.documentElement.style.setProperty('--acc', c.acc); }

function renderCats(){
  const el = $("#cats"); el.innerHTML = "";
  DATA.categories.forEach(c=>{
    const b = document.createElement("button");
    b.className = "cat"; b.role = "tab";
    b.setAttribute("aria-selected", c.id===state.cat);
    b.style.setProperty("--cat-acc", c.acc);
    b.innerHTML = `<span class="dot" style="background:${c.acc}"></span>${c.short}`;
    b.onclick = ()=>{ state.cat=c.id; state.q=""; setAccent(c); render(); };
    el.appendChild(b);
  });
}

function renderViews(){
  document.querySelectorAll(".view-btn").forEach(b=>{
    const on = b.dataset.view===state.view;
    b.setAttribute("aria-selected", on);
    b.onclick = ()=>{ state.view=b.dataset.view; state.q=""; render(); };
  });
}

function pilotosView(c){
  const q = state.q.trim().toLowerCase();
  const list = c.pilotos.filter(p=>{
    if(!q) return true;
    return (p.nombre+" "+(p.equipo||"")+" "+(p.marca||"")+" "+p.n).toLowerCase().includes(q);
  }).sort((a,b)=> numval(a.n) - numval(b.n));
  const rows = list.map(p=>{
    const parts = [];
    if(p.equipo) parts.push(p.equipo);
    let veh = "";
    if(p.marca) veh = `<span class="marca">${p.marca}</span>${p.modelo?" · "+p.modelo:""}`;
    const sub = [p.equipo, veh].filter(Boolean).join(" &nbsp;·&nbsp; ");
    return `<div class="row">
      <div class="num">${p.n}</div>
      <div class="who">
        <div class="name">${p.nombre}</div>
        ${sub?`<div class="sub">${sub}</div>`:""}
      </div>
    </div>`;
  }).join("");
  return `<div class="meta">
      <input class="search" id="q" placeholder="Buscar piloto, equipo, número…" value="${state.q.replace(/"/g,'&quot;')}" autocomplete="off" style="max-width:none;margin-left:0">
    </div>
    ${list.length?rows:`<div class="empty"><div class="big">Sin resultados</div>Probá con otro nombre o número.</div>`}`;
}

function campeonatoView(c){
  const camp = c.campeonato;
  if(!camp){
    return `<div class="empty">
      <div class="big">Campeonato en camino</div>
      La tabla de ${c.name} se completa automáticamente cuando el scraper lee la página oficial de la categoría.
    </div>`;
  }
  const t = camp.tabla;
  const top = t.slice(0,3);
  const order = [top[1], top[0], top[2]].filter(Boolean); // 2 - 1 - 3
  const podium = order.map(p=>{
    const cls = p.pos===1?"pod p1":"pod";
    return `<div class="${cls}" style="--pos-c:${posColor(p.pos)}">
      <div class="pos">${p.pos}°</div>
      <div class="pn">${shortName(p.nombre)}</div>
      <div class="pnum">#${p.n}</div>
      <div class="pts">${p.pts}<span>pts</span></div>
    </div>`;
  }).join("");
  const rows = t.map(p=>{
    const lead = p.pos===1?" lead":"";
    const marca = p.marca?`<em>${p.marca}</em>`:"";
    const wins = p.wins?` 🏆${p.wins}`:"";
    return `<div class="st${lead}">
      <div class="p">${p.pos}</div>
      <div class="cn">#${p.n}</div>
      <div class="sn">${p.nombre}${wins}${marca}</div>
      <div class="sp">${p.pts}</div>
    </div>`;
  }).join("");
  return `<div class="podium">${podium}</div>
    <div class="tbl-h"><h2>Posiciones</h2><span class="fechas">${camp.fechas}</span></div>
    ${rows}`;
}

function accOf(catId){ const c = catById(catId); return c ? c.acc : "var(--muted)"; }
function shortOf(catId){ const c = catById(catId); return c ? c.short : catId; }

function cronogramaView(){
  const cr = DATA.cronograma;
  if(!cr || !cr.dias || !cr.dias.length){
    return `<div class="empty"><div class="big">Cronograma en camino</div>
      Los horarios del sábado y domingo se cargan desde el panel.</div>`;
  }
  const di = Math.min(state.dia, cr.dias.length-1);
  const tabs = cr.dias.map((d,i)=>
    `<button class="daytab" role="tab" aria-selected="${i===di}" onclick="setDia(${i})">${d.dia}</button>`
  ).join("");
  const rows = (cr.dias[di].sesiones||[]).map(s=>{
    const chip = s.cat
      ? `<span class="chip" style="--chip-c:${accOf(s.cat)}">${shortOf(s.cat)}</span>`
      : `<span class="chip all">Todas</span>`;
    return `<div class="ses">
      <div class="h">${s.hora||"--:--"}</div>
      <div class="act">${s.actividad}</div>
      ${chip}
    </div>`;
  }).join("");
  const nota = cr.ejemplo ? `<div class="note">Horarios de ejemplo — se cargan y editan desde el panel.</div>` : "";
  return `${nota}<div class="daytabs" role="tablist">${tabs}</div>${rows}`;
}
window.setDia = i => { state.dia = i; render(); };

function shortName(full){
  // "Werner, Mariano" -> "Werner"; "López de Calatayud, Julio" -> "López de Calatayud"
  return full.split(",")[0].trim();
}

const dismissed = new Set();
function renderAvisos(){
  const box = $("#avisos");
  const list = (DATA.avisos||[]).filter(a=>!dismissed.has(a.id) && (!a.cat || a.cat===state.cat));
  box.innerHTML = list.map(a=>`
    <div class="aviso" data-id="${a.id}">
      <span class="bell" aria-hidden="true">🔔</span>
      <div class="txt"><b>Aviso</b> · ${a.txt}</div>
      <button class="x" aria-label="Cerrar aviso" data-x="${a.id}">✕</button>
    </div>`).join("");
  box.querySelectorAll("[data-x]").forEach(b=>{
    b.onclick = ()=>{ dismissed.add(b.dataset.x); renderAvisos(); };
  });
}

function render(){
  const c = catById(state.cat);
  setAccent(c);
  renderCats(); renderViews(); renderAvisos();
  $("#content").innerHTML =
    state.view==="pilotos" ? pilotosView(c) :
    state.view==="campeonato" ? campeonatoView(c) :
    cronogramaView();
  const q = $("#q");
  if(q){
    q.oninput = e=>{
      state.q = e.target.value;
      // re-render only the list area to keep focus
      const c2 = catById(state.cat);
      $("#content").innerHTML = pilotosView(c2);
      const nq = $("#q"); nq.focus();
      nq.setSelectionRange(nq.value.length, nq.value.length);
      nq.oninput = q.oninput;
    };
  }
}

// ===== Presencia en vivo =====
const DEVICE = (function(){
  let d = localStorage.getItem("lalista_device");
  if(!d){
    d = "d-" + (self.crypto && crypto.randomUUID ? crypto.randomUUID()
                : Date.now()+"-"+Math.random().toString(36).slice(2));
    try{ localStorage.setItem("lalista_device", d); }catch(e){}
  }
  return d;
})();

// Arranque: intenta leer la API (mismo origen). Si falla, usa los datos embebidos.
async function boot(){
  let hasBackend = false;
  try{
    const [d, av] = await Promise.all([
      fetch("/api/data").then(r=>{ if(!r.ok) throw 0; return r.json(); }),
      fetch("/api/avisos").then(r=> r.ok ? r.json() : [])
    ]);
    if(d && Array.isArray(d.categories) && d.categories.length){
      DATA = {
        updated: d.updated || "",
        avisos: Array.isArray(av) ? av : [],
        cronograma: d.cronograma || {dias:[]},
        categories: d.categories
      };
      if(!DATA.categories.find(c=>c.id===state.cat)) state.cat = DATA.categories[0].id;
      hasBackend = true;
    }
  }catch(e){ /* sin backend: queda el snapshot embebido */ }
  render();
  if(hasBackend){ startPresence(); registerVisit(); }
}

async function registerVisit(){
  try{
    await fetch("/api/visit", {method:"POST", headers:{"Content-Type":"application/json"},
                               body:JSON.stringify({device:DEVICE})});
  }catch(e){}
}

// Latido de presencia: cada app abierta pega cada ~20s para que el panel /admin
// pueda contar los conectados. El número NO se muestra en la app (solo en admin).
async function pingOnce(){
  if(document.visibilityState !== "visible") return;   // solo cuenta si está a la vista
  try{
    const r = await fetch("/api/ping", {method:"POST", headers:{"Content-Type":"application/json"},
                                        body:JSON.stringify({device:DEVICE})});
    if(r.ok){
      const d = await r.json();
      if(Array.isArray(d.avisos)) syncAvisos(d.avisos);   // avisos nuevos aparecen solos
    }
  }catch(e){}
}
// Actualiza los avisos si cambiaron (sin re-renderizar de gusto ni perder los cerrados)
function syncAvisos(list){
  DATA.avisos = list;
  const sig = JSON.stringify(list.map(a=>[a.id, a.txt, a.cat]));
  if(sig !== window._avisosSig){ window._avisosSig = sig; renderAvisos(); }
}
function startPresence(){
  pingOnce();
  setInterval(pingOnce, 20000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") pingOnce(); });
}

boot();

// Service worker (instalable + offline). Silencioso si el entorno no lo permite.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
